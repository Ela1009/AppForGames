<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-wrapper-fixed">
    <div class="auth-left-fixed">
        <img src="https://www.cato.org/sites/cato.org/files/styles/aside_3x/public/2024-04/video-games.jpg?itok=p5Uxrrkz"
             alt="Gaming Image" />
    </div>
    <div class="auth-right-fixed">
        <div class="auth-container">
            <h2>Register</h2>
            <form th:action="@{/auth/register}" method="post">
                <input type="text" name="username" placeholder="Username" required />
                <input type="email" name="email" placeholder="Email" required />
                <input type="password" name="password" placeholder="Password" required />
                <input type="submit" value="Register" />
            </form>
            <p style="margin-top: 20px;">
                Already have an account?
                <a th:href="@{/auth/login}" style="color: #00796b; font-weight: bold;">Go to login</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
