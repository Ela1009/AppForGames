<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Wishlist</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .games-list {
            max-width: 1100px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding: 20px;
        }

        .game-card {
            display: flex;
            background-color: #f1fefc;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0, 150, 136, 0.15);
            overflow: hidden;
            transition: transform 0.2s;
        }

        .game-card:hover {
            transform: scale(1.01);
        }

        .game-cover {
            width: 200px;
            height: 260px;
            object-fit: cover;
        }

        .game-info {
            padding: 20px;
            flex: 1;
        }

        .game-info h2 {
            margin-top: 0;
            color: #00796b;
        }

        .game-info p {
            margin: 6px 0;
            color: #004d40;
        }

        .youtube-link {
            display: inline-block;
            margin-top: 10px;
            color: #0288d1;
            font-weight: bold;
            text-decoration: none;
        }

        .youtube-link:hover {
            text-decoration: underline;
        }



        .back-link {
            display: inline-block;
            margin: 40px auto 0;
            text-align: center;
            color: #00796b;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="navbar">
    <h1>GameApp - Your Wishlist</h1>
    <form th:action="@{/auth/logout}" method="post" style="display:inline;">
        <button type="submit" class="logout-btn">Logout</button>
    </form>
</div>

<div class="games-list">
    <a th:href="@{/user/dashboard}" class="back-link">BACK</a>
    <div class="game-card" th:each="entry : ${wishlist}">
        <img class="game-cover" th:src="${entry.game.coverImageUrl}" alt="Cover Image">
        <div class="game-info">
            <h2 th:text="${entry.game.title}">Game Title</h2>
            <p><strong>Description:</strong> <span th:text="${entry.game.description}">Game Description</span></p>
            <p><strong>Release Date:</strong> <span th:text="${entry.game.releaseDate}">2022-01-01</span></p>
            <p><strong>Genre:</strong> <span th:text="${entry.game.genre}">Genre</span></p>
            <p><strong>Platform:</strong> <span th:text="${entry.game.platform}">Platform</span></p>
            <p><strong>Developer:</strong> <span th:text="${entry.game.developer}">Dev</span></p>
            <p><strong>Publisher:</strong> <span th:text="${entry.game.publisher}">Publisher</span></p>
            <a class="youtube-link" th:href="${entry.game.youtubeTrailerUrl}" target="_blank">Watch Trailer on YouTube</a>

            <form th:action="@{'/wishlist/remove/' + ${entry.game.id}}" method="post">
                <button type="submit" class="wishlist-btn">Remove from Wishlist</button>
            </form>

        </div>
    </div>
</div>



</body>
</html>
